---
layout: page
title: My blog
---

<div class="row">
    {% for post in site.posts %}
    <div class="col-lg-12">
        <article class="mb-4 pb-4 border-bottom">
            <h3 class="fw-bold mb-2">
                <a href="{{ post.url }}" class="text-dark text-decoration-none">{{ post.title }}</a>
            </h3>
            <div class="text-muted small mb-3">
                <i class="bi bi-calendar3 me-1"></i> {{ post.date | date: "%B %d, %Y" }}
            </div>
            <p class="text-secondary mb-3">
                {{ post.excerpt | strip_html | truncatewords: 30 }}
            </p>
            <a href="{{ post.url }}" class="btn btn-primary rounded-pill px-4 py-2 shadow-sm">
                Read More <i class="bi bi-arrow-right ms-1"></i>
            </a>
        </article>
    </div>
    {% endfor %}
</div>

<div class="mt-4">
    <a href="/index.html" class="btn btn-outline-secondary rounded-pill px-4 py-2">
        <i class="bi bi-arrow-left me-1"></i> Back to Portfolio
    </a>
</div>
